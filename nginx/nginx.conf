server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # Re-resolve service addresses after Compose recreates containers.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $dashboard_backend dashboard:3000;
    set $gateway_backend gateway:3000;
    # Overwrite incoming forwarding headers: Express trusts this one hop.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    location / { proxy_pass http://$dashboard_backend; }
    location /api/ { proxy_pass http://$gateway_backend; }
    location = /health { proxy_pass http://$gateway_backend; }
    location = /ready { proxy_pass http://$gateway_backend; }
}
