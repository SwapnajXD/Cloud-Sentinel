server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # Overwrite incoming forwarding headers: Express trusts this one hop.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    location / { proxy_pass http://dashboard:3000; }
    location /api/ { proxy_pass http://gateway:3000; }
    location = /health { proxy_pass http://gateway:3000; }
    location = /ready { proxy_pass http://gateway:3000; }
}
