version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: cloud-sentinel-gateway:latest
    env_file: .env
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    networks:
      - sentinel_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: cloud-sentinel-worker:latest
    env_file: .env
    depends_on:
      - redis
      - db
    networks:
      - sentinel_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sentinel_net

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloud_sentinel
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - sentinel_net

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sentinel_net

volumes:
  pgdata:
  redis_data:

networks:
  sentinel_net:
    driver: bridge
