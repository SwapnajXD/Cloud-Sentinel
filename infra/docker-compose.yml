services:
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    image: cloud-sentinel-dashboard:latest
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      - gateway
    networks:
      - sentinel_net


  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    image: cloud-sentinel-gateway:latest
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@db:5432/cloud_sentinel
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sentinel_net


  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    image: cloud-sentinel-worker:latest
    env_file:
      - ../.aws.env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://postgres:postgres@db:5432/cloud_sentinel
      - FLOCI_ENDPOINT=http://100.117.35.70:4566
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - sentinel_net


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - sentinel_net


  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloud_sentinel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloud_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - sentinel_net


  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sentinel_net


volumes:
  pgdata:
  redis_data:


networks:
  sentinel_net:
    driver: bridge