AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Creates a read-only IAM role that Cloud-Sentinel can assume (via
  sts:AssumeRole with an External ID) to scan this AWS account. Grants
  ONLY the specific read-only actions Cloud-Sentinel's scan modules
  actually call - no write/modify permissions of any kind, on anything.

Parameters:
  TrustedPrincipalArn:
    Type: String
    Description: >
      The ARN of the Cloud-Sentinel worker's IAM identity that is allowed
      to assume this role. Pre-filled by the "Connect AWS Account" link in
      the dashboard - you shouldn't need to edit this.

  ExternalId:
    Type: String
    Description: >
      A random, per-connection secret generated by Cloud-Sentinel and
      required on every AssumeRole call. Prevents the "confused deputy"
      problem (someone else guessing or reusing this role's ARN). Pre-filled
      by the dashboard - do not share this value or reuse it elsewhere.
    NoEcho: true

  RoleName:
    Type: String
    Default: CloudSentinelScanRole
    Description: Name of the IAM role created in this account.

Resources:
  ScanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: >
        Read-only role for Cloud-Sentinel AWS security scans. No write
        permissions on anything - see CloudSentinelReadOnlyPolicy below
        for the exact action list.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: CloudSentinelReadOnlyPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # S3 - bucket inventory, encryption, and ACL checks.
              # NOTE: Cloud-Sentinel currently checks public access via
              # bucket ACLs only, not bucket policies - s3:GetBucketPolicy
              # is intentionally not requested here since nothing uses it
              # yet. Extending that check would need it added here too.
              - Sid: S3ReadOnly
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetEncryptionConfiguration
                  - s3:GetBucketAcl
                Resource: "*"

              # EC2 - running instances and security group rules.
              - Sid: EC2ReadOnly
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeSecurityGroups
                Resource: "*"

              # IAM - account-wide MFA and access-key-age checks.
              - Sid: IAMReadOnly
                Effect: Allow
                Action:
                  - iam:ListUsers
                  - iam:ListMFADevices
                  - iam:ListAccessKeys
                  - iam:GetAccessKeyLastUsed
                  - iam:GetAccountSummary
                Resource: "*"

              # STS - only ever used to identify the calling identity for
              # the self-MFA check, never to assume further roles.
              - Sid: STSReadOnly
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"

              # RDS - public accessibility and storage encryption.
              - Sid: RDSReadOnly
                Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                Resource: "*"

              # Lambda - function URLs, resource policies, runtimes.
              - Sid: LambdaReadOnly
                Effect: Allow
                Action:
                  - lambda:ListFunctions
                  - lambda:GetFunctionUrlConfig
                  - lambda:GetPolicy
                Resource: "*"

Outputs:
  RoleArn:
    Description: >
      Copy this ARN back into the Cloud-Sentinel dashboard's "Connect AWS
      Account" screen to finish connecting this account.
    Value: !GetAtt ScanRole.Arn
